<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>autoresize-textarea — Demo</title>
  <style>
    :root {
      --bg: #0f172a;
      --fg: #e2e8f0;
      --accent: #38bdf8;
      --card: #1e293b;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      background: var(--bg);
      color: var(--fg);
    }
    main { max-width: 560px; margin: 0 auto; padding: 2rem; }
    h1 { font-size: 2.25rem; margin-bottom: 0.5rem; }
    label { display: block; margin-top: 1.5rem; margin-bottom: 0.4rem; font-weight: 500; }

    textarea[data-autoresize] {
      width: 100%;
      min-height: 3rem;
      padding: 0.75rem 1rem;
      font: inherit;
      line-height: 1.5;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--fg);
      resize: none;
    }

    p.hint { color: #94a3b8; font-size: 0.9rem; }

    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>autoresize-textarea</h1>
    <p>Digite nos campos abaixo e veja a altura se ajustar ao conteúdo.</p>

    <label for="msg">Sem limite</label>
    <textarea id="msg" data-autoresize rows="2"
      placeholder="Vai crescendo indefinidamente…"></textarea>

    <label for="bio">Com <code>data-max-rows="5"</code></label>
    <textarea id="bio" data-autoresize data-max-rows="5" rows="2"
      placeholder="Cresce até 5 linhas, depois aparece scroll interno."></textarea>

    <label for="pre">Com valor inicial</label>
    <textarea id="pre" data-autoresize rows="2">Linha 1
Linha 2
Linha 3
Linha 4 — essa já vem grande, e o snippet ajusta a altura no load.</textarea>

    <p class="hint">O redimensionamento manual (canto inferior direito) é desligado via
    <code>resize: none</code> no CSS.</p>
  </main>

  <script src="autoresize-textarea.js"></script>
</body>
</html>
